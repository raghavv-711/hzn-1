# GitHub pauses scheduled workflows in repositories with no commits for 60 days. This makes one empty commit a
# month so the hourly refresh never stops on its own. (Commits made with the workflow token don't trigger other
# workflows, so this doesn't cause an extra deploy.)
name: Keep the hourly refresh active

on:
  schedule:
    - cron: "17 6 1 * *"   # 06:17 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Keep the hourly refresh active"
          git push
