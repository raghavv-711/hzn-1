# Builds and deploys the website. Every hour (and on every push) it records a fresh snapshot of the
# world's airborne flights, runs the fuel model on them, and publishes the result to GitHub Pages.
# The fresh flight data goes straight into the Pages deployment, so it never bloats the git history.
# If OpenSky can't be reached, the site is deployed with the flight data already in docs/.
name: Build and deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 * * * *"   # hourly, off the top of the hour when GitHub's scheduler is busiest
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - run: pip install -r tools/requirements.txt

      - name: Week number (refreshes the reference data weekly)
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Reference data (routes, airports, aircraft, boundaries)
        uses: actions/cache@v4
        with:
          key: reference-${{ steps.week.outputs.week }}
          restore-keys: reference-
          path: |
            .fuel-horizon-cache/routes.csv.gz
            .fuel-horizon-cache/airports.csv.gz
            .fuel-horizon-cache/basic-ac-db.json.gz
            .fuel-horizon-cache/countries-50m.json
            .fuel-horizon-cache/places-50m.geojson
            .fuel-horizon-cache/airlines.dat
            .fuel-horizon-cache/admin1-50m.geojson

      - name: Recent flight paths and replay frames from earlier runs
        uses: actions/cache/restore@v4
        with:
          key: history-${{ github.run_id }}
          restore-keys: history-
          path: |
            .fuel-horizon-cache/history.json.gz
            .fuel-horizon-cache/replay

      - name: Record fresh flights
        id: refresh
        continue-on-error: true
        env:
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
          PYTHONWARNINGS: ignore
        # pushes take one quick pull; scheduled runs take three, four minutes apart, so trails have shape
        run: python tools/refresh_snapshot.py --pulls ${{ github.event_name == 'push' && 1 || 3 }}

      - name: Save flight paths and replay frames for the next run
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          key: history-${{ github.run_id }}
          path: |
            .fuel-horizon-cache/history.json.gz
            .fuel-horizon-cache/replay

      - name: Note when the refresh failed
        if: steps.refresh.outcome == 'failure'
        run: echo "::warning::Couldn't record fresh flights; deploying the data already in docs/."

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
